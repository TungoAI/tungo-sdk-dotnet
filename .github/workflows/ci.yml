name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (.NET SDK ${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0.x', '9.0.x']
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Release version is consistent
        run: bash scripts/release-version.sh check "$(sed -n 's/.*<Version>\([0-9.]*\)<\/Version>.*/\1/p' src/Tungo.Sdk/Tungo.Sdk.csproj)"
      - name: Restore
        run: dotnet restore
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Build (warnings are errors; the README examples are compiled)
        run: dotnet build -c Release --no-restore -warnaserror
      - name: Test (net8.0 build and netstandard2.0 build)
        run: dotnet test -c Release --no-build
      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts
      - name: Install the package into a clean project
        run: sh scripts/package-smoke.sh artifacts
