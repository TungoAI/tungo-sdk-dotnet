# Generated by tungo-sdkgen. Do not edit.
#
# Publishes Tungo.Sdk (NuGet) when a tag vX.Y.Z is pushed. To retry a failed
# release, run this workflow manually FROM THE TAG (gh workflow run publish.yml --ref vX.Y.Z).
# The job fails when a credential is missing or the registry does not serve the new version.
#
# Repository setup:
#   - environment "release" (add required reviewers there to gate publishing)
#   - nuget.org trusted publishing policy for this repository, workflow publish.yml, environment release,
#     plus repository variable NUGET_USER (the nuget.org profile name); or secret NUGET_API_KEY
#   - optional: repository variable PUBLISH_GITHUB_PACKAGES=true to also publish to GitHub Packages
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify the release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set and verify the version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this workflow from a release tag vX.Y.Z (got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}')."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-version.sh set "${version}"
          bash scripts/release-version.sh check-release "${version}"
          if ! git diff --exit-code; then
            echo "::error::The commit tagged ${GITHUB_REF_NAME} carries a different version. Bump VERSION in tungo-sdkgen, regenerate, commit, and tag the new commit with a new version."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to NuGet
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pack
        run: |
          dotnet pack -c Release -o artifacts
          test -f "artifacts/Tungo.Sdk.${VERSION}.nupkg"
      - name: Choose registry authentication
        id: auth
        env:
          REGISTRY_TOKEN: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -n "${REGISTRY_TOKEN}" ]]; then
            echo "mode=token" >> "${GITHUB_OUTPUT}"
          else
            echo "NUGET_API_KEY is not set: using trusted publishing (OIDC)."
            echo "mode=oidc" >> "${GITHUB_OUTPUT}"
          fi
      - name: Get a short-lived NuGet API key
        id: nuget-login
        if: steps.auth.outputs.mode == 'oidc'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet (trusted publishing)
        if: steps.auth.outputs.mode == 'oidc'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/Tungo.Sdk.${VERSION}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${NUGET_API_KEY}"
      - name: Publish to NuGet (token)
        if: steps.auth.outputs.mode == 'token'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/Tungo.Sdk.${VERSION}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${NUGET_API_KEY}"
      - name: Wait until NuGet serves the new version
        env:
          URL: https://api.nuget.org/v3-flatcontainer/tungo.sdk/${{ needs.preflight.outputs.version }}/tungo.sdk.nuspec
        run: |
          for attempt in $(seq 1 120); do
            if curl -fsS -A tungo-sdk-release -o /dev/null "${URL}"; then
              echo "${URL} is available."
              exit 0
            fi
            echo "Not available yet (attempt ${attempt})."
            sleep 10
          done
          echo "::error::NuGet did not serve version ${VERSION} within 20 minutes: ${URL}"
          exit 1
      - name: Publish to GitHub Packages
        if: vars.PUBLISH_GITHUB_PACKAGES == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet nuget push "artifacts/Tungo.Sdk.${VERSION}.nupkg" --source https://nuget.pkg.github.com/TungoAI/index.json --api-key "${GITHUB_TOKEN}"

  github-release:
    name: GitHub release
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release from the CHANGELOG entry
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { printing = 1; next }
            /^## \[/ { printing = 0 }
            /^\[[^]]+\]: / { next }
            printing { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [[ ! -s "${RUNNER_TEMP}/notes.md" ]]; then
            echo "::error::CHANGELOG.md has no notes for ${VERSION}."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
